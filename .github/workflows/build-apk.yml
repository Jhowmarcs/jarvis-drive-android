name: Build JARVIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android source
        run: |
          set -e
          BASE="https://bjhslrvmwwzetcuyivbn.supabase.co/functions/v1/jarvis-build-bridge/source"
          mkdir -p app/src/main/java/com/jhowmarcs/jarvisdrive
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          curl -fsSL "$BASE?name=MainActivity.java" -o app/src/main/java/com/jhowmarcs/jarvisdrive/MainActivity.java
          curl -fsSL "$BASE?name=AndroidManifest.xml" -o app/src/main/AndroidManifest.xml
          curl -fsSL "$BASE?name=styles.xml" -o app/src/main/res/values/styles.xml
          curl -fsSL "$BASE?name=ic_launcher.xml" -o app/src/main/res/drawable/ic_launcher.xml
          curl -fsSL "$BASE?name=app-build.gradle" -o app/build.gradle

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Package APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JARVIS-Drive-v0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Drive-v0.1.0
          path: JARVIS-Drive-v0.1.0.apk
          if-no-files-found: error
          retention-days: 30
