plugins {
 id 'com.android.application'
}

android {
 amespace 'com.jhowmarcs.jarvisdrive'
 compileSdk 35

    defaultConfig {
 applicationId 'com.jhowmarcs.jarvisdrive'
 minSdk 26
 targetSdk 35
 versionCode 1
 versionName '0.1.0'
    }

    buildTypes {
        debug {
 applicationIdSuffix '.debug'
 versionNameSuffix '-debug'
        }
        release {
 minifyEnabled false
 shrinkResources false
        }
    }

    compileOptions {
 sourceCompatibility JavaVersion.VERSION_17
 targetCompatibility JavaVersion.VERSION_17
    }
}
